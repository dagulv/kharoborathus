services:

  db:
    build:
      context: .
      dockerfile: infra/db/Dockerfile
    restart: unless-stopped
    env_file:
      - infra/db/.env
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run infra/dotenv.sh, or run through infra/secrets.sh dev}
    ports:
      - 127.0.0.1:5432:5432
    volumes:
     - db:/var/lib/postgresql

volumes:
  db:
