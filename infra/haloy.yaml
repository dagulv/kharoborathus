# server is haloy_api_domain from terraform.tfvars.
# Each target reads its safe values from its own <target>/.env, see .env.example there.
# Secrets come from the prod vault. Run through haloy.sh, which gives every target its own env:
# infra/secrets.sh prod infra/haloy.sh deploy api web
server: haloy.kharoborathus.dagulv.me

targets:
  db:
    preset: database
    image:
      repository: kharoborathus-db
      build_config:
        context: ..
        dockerfile: infra/db/Dockerfile
    port: 5432
    volumes:
      - kharoborathus-db:/var/lib/postgresql
    env:
      - name: POSTGRES_USER
        from:
          env: POSTGRES_USER
      - name: POSTGRES_PASSWORD
        from:
          env: POSTGRES_PASSWORD
      - name: POSTGRES_DB
        from:
          env: POSTGRES_DB

  api:
    # A fixed name lets the admin reach the internal port at api:3002.
    # Replace also keeps two scrapers from overlapping during a deploy.
    naming_strategy: static
    deployment_strategy: replace
    image:
      repository: kharoborathus-api
      build_config:
        context: ..
        dockerfile: infra/api/Dockerfile
    domains:
      - domain: api.kharoborathus.dagulv.me
    port: 3001
    health_check_path: /feeds?limit=1
    env:
      - name: POSTGRES_CONNECTION_STRING
        from:
          env: POSTGRES_CONNECTION_STRING
      - name: DEEPSEEK_API_KEY
        from:
          env: DEEPSEEK_API_KEY
      - name: TYPESAFE_API_KEY
        from:
          env: TYPESAFE_API_KEY
      - name: BRAVE_API_KEY
        from:
          env: BRAVE_API_KEY

  web:
    image:
      repository: kharoborathus-web
      build_config:
        context: ../frontend
        dockerfile: ../infra/web/Dockerfile
    domains:
      - domain: kharoborathus.dagulv.me
    port: 3000
    health_check_path: /healthz
    env:
      - name: ORIGIN
        from:
          env: ORIGIN
      - name: API_URL
        from:
          env: API_URL
      - name: POSTGRES_CONNECTION_STRING
        from:
          env: POSTGRES_CONNECTION_STRING
