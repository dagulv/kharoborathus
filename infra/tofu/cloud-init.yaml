#cloud-config
package_update: true
package_upgrade: true

packages:
  - docker.io
  - ufw
  - unattended-upgrades

write_files:
  # sshd keeps the first value it reads, so this must sort before cloud-init's 50-cloud-init.conf.
  - path: /etc/ssh/sshd_config.d/01-hardening.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
  # Rotated logs, so a long-running scraper cannot fill the disk.
  - path: /etc/docker/daemon.json
    content: |
      {"log-driver": "local"}

runcmd:
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - systemctl enable --now docker
  - curl -fsSL https://sh.haloy.dev/install-haloyd.sh | VERSION=v0.1.0-beta.73 API_DOMAIN=${haloy_api_domain} sh
  # The token lives in root-only /etc/haloy. A copy lets the deploy user read it over SSH.
  - install -m 600 -o deploy /dev/null /home/deploy/haloy-token
  - /usr/local/bin/haloyd config get api-token --raw > /home/deploy/haloy-token
  - systemctl restart ssh
